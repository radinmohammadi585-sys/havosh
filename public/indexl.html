<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>کاوش AI</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{
  --bg:#05060f;
  --panel:#0e1330;
  --panel-2:#131a3d;
  --border:#252b4b;
  --text:#e9eaff;
  --muted:#9aa1c7;
  --accent:#7c6cff;
  --accent-2:#5b8cff;
  --radius:18px;
  --t-fast:150ms;
  --t-med:280ms;
  --t-slow:600ms;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Vazirmatn',tahoma,system-ui,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
#galaxy{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  opacity:0;transition:opacity 1.6s ease;
}
#galaxy.show{opacity:1}
.app{
  position:relative;z-index:1;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  background:
    radial-gradient(1200px 800px at 70% -10%, rgba(124,108,255,.10), transparent 60%),
    radial-gradient(900px 600px at 10% 100%, rgba(91,140,255,.08), transparent 55%),
    transparent;
}
.header{
  padding:14px 20px;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  background:rgba(5,6,15,.55);
}
.logo{font-size:22px;font-weight:800;letter-spacing:.2px}
.logo span{
  background:linear-gradient(90deg,#a89bff,#5b8cff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
select{
  background:var(--panel);color:var(--text);
  border:1px solid var(--border);border-radius:14px;
  padding:9px 12px;font:inherit;font-size:13px;cursor:pointer;
  transition:border-color var(--t-fast),background var(--t-fast);
}
select:hover{border-color:#3d4680}
select:focus{outline:none;border-color:var(--accent)}
.main{
  flex:1;overflow:auto;text-align:center;padding:40px 22px;
}
.brain{
  font-size:52px;display:inline-block;
  animation:float 4s ease-in-out infinite;
  filter:drop-shadow(0 0 24px rgba(124,108,255,.55));
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1{font-size:clamp(24px,4vw,38px);margin:16px 0 10px;font-weight:800}
p{color:var(--muted);font-size:clamp(14px,1.6vw,17px);line-height:2;max-width:640px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
.chips button{
  background:rgba(255,255,255,.03);color:var(--text);
  border:1px solid var(--border);border-radius:22px;
  padding:11px 16px;font:inherit;font-size:13px;cursor:pointer;
  transition:all var(--t-fast);
  opacity:0;animation:chipIn .5s ease forwards;
}
.chips button:hover{background:rgba(124,108,255,.15);border-color:var(--accent);transform:translateY(-1px)}
@keyframes chipIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.chat{
  flex:1;overflow-y:auto;padding:18px 16px 8px;
  scroll-behavior:smooth;display:none;overscroll-behavior:contain;
}
.chat.show{display:block}
.chat::-webkit-scrollbar{width:8px}
.chat::-webkit-scrollbar-thumb{background:#2a3159;border-radius:4px}
.chat::-webkit-scrollbar-thumb:hover{background:#3d4680}
.msg{
  padding:12px 16px;border-radius:16px;margin:10px 0;
  white-space:pre-wrap;line-height:1.9;font-size:14.5px;
  max-width:min(760px,88%);word-wrap:break-word;
  animation:msgIn var(--t-med) cubic-bezier(.2,.9,.3,1.2);
}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.user{
  background:linear-gradient(135deg,#6d5dfc,#5b8cff);
  margin-right:auto;margin-left:40px;
  border-bottom-right-radius:6px;
}
.ai{
  background:var(--panel);border:1px solid var(--border);
  margin-left:auto;margin-right:40px;
  border-bottom-left-radius:6px;
}
.msg.error{background:#2a1430;border-color:#5a2040;color:#ffb4c8}
.src{
  margin:0 40px 12px auto;font-size:12px;line-height:2;
  color:var(--muted);max-width:min(760px,88%);
  animation:msgIn var(--t-med) ease;
}
.src a{color:#8fa2ff;margin-left:10px;text-decoration:none;display:inline-block}
.src a:hover{text-decoration:underline}
.media-wrap{position:relative;margin-top:10px}
.media{
  display:block;max-width:100%;border-radius:14px;
  background:#0a0f24;min-height:80px;
  opacity:0;transition:opacity var(--t-slow) ease;
}
.media.loaded{opacity:1}
.media-skel{
  position:absolute;inset:0;border-radius:14px;
  background:linear-gradient(100deg,#131a3d 30%,#1c2550 50%,#131a3d 70%);
  background-size:200% 100%;
  animation:shimmer 1.4s linear infinite;
}
@keyframes shimmer{to{background-position:-200% 0}}
.dl{display:inline-block;margin-top:8px;color:#8fa2ff;font-size:12px;text-decoration:none}
.dl:hover{text-decoration:underline}
.think{
  display:none;align-items:center;gap:10px;
  padding:10px 22px;color:var(--muted);font-size:13px;
}
.think.show{display:flex;animation:msgIn var(--t-med) ease}
.dots{display:inline-flex;gap:4px;margin-inline-start:4px}
.dots i{
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:pulse 1.2s ease-in-out infinite;
}
.dots i:nth-child(2){animation-delay:.15s;background:var(--accent-2)}
.dots i:nth-child(3){animation-delay:.3s;background:#a89bff}
@keyframes pulse{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.bottom{
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);display:flex;gap:10px;
  background:rgba(5,6,15,.65);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
input#msg{
  flex:1;background:var(--panel);color:var(--text);
  border:1px solid var(--border);border-radius:16px;
  padding:13px 16px;font:inherit;font-size:14px;
  transition:border-color var(--t-fast);
}
input#msg:focus{outline:none;border-color:var(--accent)}
.send{
  background:linear-gradient(135deg,#6d5dfc,#5b8cff);
  color:#fff;border:0;border-radius:14px;
  padding:13px 22px;font:inherit;font-weight:600;cursor:pointer;
  transition:transform var(--t-fast),opacity var(--t-fast);
}
.send:hover:not(:disabled){transform:translateY(-1px)}
.send:active:not(:disabled){transform:translateY(0)}
.send:disabled{opacity:.5;cursor:not-allowed}
.cursor{
  display:inline-block;width:7px;height:14px;background:var(--accent);
  vertical-align:-2px;margin-inline-start:2px;
  animation:blink .9s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}
@media (max-width:640px){
  .header{padding:12px 14px}
  .logo{font-size:18px}
  .sub{display:none}
  .tools select{font-size:12px;padding:7px 10px}
  .user{margin-left:16px}
  .ai{margin-right:16px}
  .src{margin-right:16px}
  .msg{font-size:14px;max-width:92%}
  .main{padding:28px 16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<canvas id="galaxy" aria-hidden="true"></canvas>

<div class="app">
  <header class="header">
    <div>
      <div class="logo">کاوش <span>✨</span></div>
      <div class="sub">دستیار هوشمند عمومی</div>
    </div>
    <div class="tools">
      <select id="kind" title="نوع خروجی">
        <option value="chat">💬 گفتگو</option>
        <option value="image">🖼️ تصویر</option>
        <option value="video">🎬 ویدیو</option>
      </select>
      <select id="search" title="جستجوی وب">
        <option value="auto">🌐 خودکار</option>
        <option value="on">🌐 همیشه</option>
        <option value="off">🌐 خاموش</option>
      </select>
      <select id="mode" title="نسخه">
        <option value="lite">⚡ Lite</option>
        <option value="mios">🧠 MIOS</option>
        <option value="astara" selected>✨ Astara</option>
      </select>
    </div>
  </header>

  <section class="main" id="welcome">
    <div class="brain">🧠</div>
    <h1>سلام! من کاوشم.</h1>
    <p>برای درس، ریاضی، برنامه‌نویسی، زبان، ایده‌پردازی و تحقیق کنارت هستم. اخبار و اطلاعات به‌روز را هم از وب پیدا می‌کنم.</p>
    <div class="chips">
      <button style="animation-delay:.05s">یک مسئله ریاضی حل کن</button>
      <button style="animation-delay:.15s">این متن را خلاصه کن</button>
      <button style="animation-delay:.25s">پایتون یادم بده</button>
      <button style="animation-delay:.35s">آخرین اخبار فناوری چیست؟</button>
    </div>
  </section>

  <main class="chat" id="chat" role="log" aria-live="polite"></main>

  <div class="think" id="think" aria-hidden="true">
    <span>کاوش در حال فکر کردن است</span>
    <span class="dots"><i></i><i></i><i></i></span>
  </div>

  <footer class="bottom">
    <input id="msg" placeholder="پیامت را بنویس..." autocomplete="off" enterkeyhint="send">
    <button class="send" id="sendBtn" type="button">ارسال</button>
  </footer>
</div>

<script>
(function galaxy(){
  const c = document.getElementById('galaxy');
  if(!c || !c.getContext) return;
  const ctx = c.getContext('2d', {alpha:true});
  let W, H, stars = [], nebulas = [];
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  const isMobile = matchMedia('(max-width:640px)').matches;
  const STAR_COUNT = isMobile ? 90 : 180;
  let raf = null;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = c.width  = Math.floor(innerWidth * dpr);
    H = c.height = Math.floor(innerHeight * dpr);
    c.style.width  = innerWidth + 'px';
    c.style.height = innerHeight + 'px';
    buildScene();
  }
  function buildScene(){
    stars = Array.from({length:STAR_COUNT}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: (Math.random()*1.3 + .3) * dpr,
      a: Math.random()*.7 + .3,
      tw: Math.random()*Math.PI*2,
      vy: (Math.random()*.08 + .02) * dpr,
    }));
    const m = Math.min(W,H);
    nebulas = [
      {x:W*.72, y:H*.06, r:m*.42, c:'124,108,255', a:.09},
      {x:W*.10, y:H*.95, r:m*.38, c:'91,140,255',  a:.07},
      {x:W*.45, y:H*.55, r:m*.30, c:'164,120,255', a:.05},
    ];
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(const n of nebulas){
      const g = ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
      g.addColorStop(0, 'rgba(' + n.c + ',' + n.a + ')');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(n.x-n.r, n.y-n.r, n.r*2, n.r*2);
    }
    for(const s of stars){
      s.tw += .015;
      const tw = .55 + Math.sin(s.tw)*.45;
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
      s.y += s.vy;
      if(s.y > H+4){ s.y = -4; s.x = Math.random()*W; }
    }
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(draw);
  }
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){ if(raf){ cancelAnimationFrame(raf); raf = null; } }
    else if(!raf){ raf = requestAnimationFrame(draw); }
  });
  addEventListener('resize', resize, {passive:true});
  resize();
  requestAnimationFrame(() => c.classList.add('show'));
  raf = requestAnimationFrame(draw);
})();

const REMOTE_URL = "https://havosh.onrender.com/api/ai-chat";
const API_URL  = location.protocol.startsWith("http") ? "/api/ai-chat" : REMOTE_URL;
const API_BASE = API_URL.replace('/api/ai-chat','');

const chatEl   = document.getElementById('chat');
const welcome  = document.getElementById('welcome');
const thinkEl  = document.getElementById('think');
const msgEl    = document.getElementById('msg');
const modeEl   = document.getElementById('mode');
const searchEl = document.getElementById('search');
const sendBtn  = document.getElementById('sendBtn');
const kindEl   = document.getElementById('kind');

const STORAGE_KEY = 'kavosh.history.v1';
const history = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));

function saveHistory(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(-60))); }catch(e){}
}
function loadHistory(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr)
      ? arr.filter(x => x && (x.role==='user' || x.role==='assistant') && typeof x.content === 'string')
      : [];
  }catch(e){ return []; }
}
function makeMsg(text, cls, opts){
  opts = opts || {};
  const d = document.createElement('div');
  d.className = 'msg ' + (cls || '');
  if(opts.typing){ d.dataset.typing = '1'; }
  else{ d.textContent = text; }
  chatEl.appendChild(d);
  return d;
}
function scrollDown(smooth){
  chatEl.scrollTo({top: chatEl.scrollHeight, behavior: smooth===false ? 'auto' : 'smooth'});
}
function addSources(list){
  if(!Array.isArray(list) || !list.length) return;
  const box = document.createElement('div');
  box.className = 'src';
  box.append('منابع: ');
  list.forEach((s,i) => {
    if(!s || !/^https?:\/\//.test(s.url || '')) return;
    const a = document.createElement('a');
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = '[' + (i+1) + '] ' + (s.title || s.url).slice(0,60);
    box.appendChild(a);
  });
  if(box.children.length > 1){
    chatEl.appendChild(box);
    scrollDown();
  }
}
async function typeInto(el, text, speed){
  speed = speed || 18;
  const len = text.length;
  const step = len > 800 ? Math.ceil(len / 260) : 1;
  el.dataset.typing = '1';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  el.appendChild(cursor);
  let i = 0;
  while(i < len){
    i = Math.min(len, i + step);
    el.textContent = text.slice(0, i);
    el.appendChild(cursor);
    scrollDown(false);
    if(i < len) await sleep(speed);
  }
  cursor.remove();
  delete el.dataset.typing;
  scrollDown();
}
function showChat(){
  if(welcome) welcome.style.display = 'none';
  chatEl.classList.add('show');
}
async function renderStoredHistory(){
  const stored = loadHistory();
  if(!stored.length) return;
  showChat();
  for(const m of stored){
    makeMsg(m.content, m.role === 'user' ? 'user' : 'ai');
    history.push(m);
    await sleep(60);
  }
  scrollDown(false);
}
async function send(){
  const v = msgEl.value.trim();
  if(!v) return;
  showChat();
  msgEl.value = '';
  msgEl.focus();
  makeMsg(v, 'user');
  history.push({role:'user', content:v});
  saveHistory();
  scrollDown();
  thinkEl.classList.add('show');
  sendBtn.disabled = true;
  try{
    if(kindEl.value !== 'chat'){
      await (kindEl.value === 'image' ? makeImage(v) : makeVideo(v));
      return;
    }
    let data = {}, raw = '';
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        messages: history.slice(-20),
        edition: modeEl.value,
        search: searchEl.value
      })
    });
    try{ raw = await res.text(); data = JSON.parse(raw); }catch(e){}
    const out = data.answer || data.error ||
      (res.ok ? 'پاسخی دریافت نشد' : 'خطا (' + res.status + '): ' + String(raw).slice(0,200));
    thinkEl.classList.remove('show');
    const bubble = makeMsg('', 'ai', {typing:true});
    await typeInto(bubble, out);
    history.push({role:'assistant', content:out});
    saveHistory();
    addSources(data.sources);
  }catch(err){
    thinkEl.classList.remove('show');
    makeMsg('اتصال به سرور برقرار نشد. اگر سرور Render تازه بیدار شده، چند ثانیه صبر کن و دوباره بفرست.', 'ai error');
  }finally{
    thinkEl.classList.remove('show');
    sendBtn.disabled = false;
    msgEl.focus();
  }
}
async function postJson(path, body){
  const res = await fetch(API_BASE + path, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok && !data.error) data.error = 'خطا (' + res.status + ')';
  return data;
}
function addMedia(tag, src){
  const wrap = document.createElement('div');
  wrap.className = 'msg ai';
  const holder = document.createElement('div');
  holder.className = 'media-wrap';
  const skel = document.createElement('div');
  skel.className = 'media-skel';
  holder.appendChild(skel);
  const el = document.createElement(tag);
  el.className = 'media';
  el.src = src;
  if(tag === 'video'){ el.controls = true; el.preload = 'metadata'; el.playsInline = true; }
  const reveal = () => { el.classList.add('loaded'); if(skel.parentNode) skel.remove(); };
  el.addEventListener('load', reveal, {once:true});
  el.addEventListener('loadeddata', reveal, {once:true});
  el.addEventListener('error', reveal, {once:true});
  holder.appendChild(el);
  wrap.appendChild(holder);
  if(/^https?:|^data:image\//.test(src)){
    const a = document.createElement('a');
    a.className = 'dl';
    a.href = src; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.download = tag === 'img' ? 'kavosh.png' : 'kavosh.mp4';
    a.textContent = 'دانلود / باز کردن';
    wrap.appendChild(a);
  }
  chatEl.appendChild(wrap);
  scrollDown();
}
async function makeImage(prompt){
  const data = await postJson('/api/image', {prompt: prompt});
  if(!data.ok || !data.image){
    makeMsg(data.error || 'ساخت تصویر ناموفق بود', 'ai error');
    return;
  }
  addMedia('img', data.image);
}
async function makeVideo(prompt){
  const data = await postJson('/api/video', {prompt: prompt});
  if(!data.ok || !data.id){
    makeMsg(data.error || 'ساخت ویدیو ناموفق بود', 'ai error');
    return;
  }
  makeMsg('ویدیو در حال ساخت است؛ معمولاً یکی دو دقیقه طول می‌کشد...', 'ai');
  for(let i=0; i<60; i++){
    await sleep(4000);
    let st = {};
    try{
      const r = await fetch(API_BASE + '/api/video-status?id=' + encodeURIComponent(data.id));
      st = await r.json();
    }catch(e){ continue; }
    if(st.status === 'done' && st.video){ addMedia('video', st.video); return; }
    if(st.status === 'failed' || (st.ok === false && st.error)){
      makeMsg(st.error || 'ساخت ویدیو ناموفق بود', 'ai error');
      return;
    }
  }
  makeMsg('ساخت ویدیو بیش از حد طول کشید. بعداً دوباره تلاش کن.', 'ai error');
}
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
sendBtn.addEventListener('click', send);
msgEl.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
document.querySelectorAll('.chips button').forEach(b => {
  b.addEventListener('click', () => { msgEl.value = b.textContent; send(); });
});
requestAnimationFrame(() => {
  setTimeout(renderStoredHistory, 320);
});
</script>
</body>
</html>
