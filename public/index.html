<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کاوش AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b1d;color:#e9eaff;font-family:tahoma}
.app{min-height:100vh;display:flex;flex-direction:column}
.header{padding:22px;border-bottom:1px solid #252b4b;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:28px;font-weight:bold}
.sub{color:#9aa1c7;font-size:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap}
select{background:#121936;color:white;border:1px solid #38406b;border-radius:18px;padding:12px}
.main{flex:1;text-align:center;padding:50px 25px}
.brain{font-size:55px}
h1{font-size:42px;margin:20px 0}
p{color:#b5bbd8;font-size:20px;line-height:2}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:35px}
.chips button{background:#111832;color:#ddd;border:1px solid #343c66;border-radius:25px;padding:14px;cursor:pointer}
.chat{display:none;flex:1;padding:20px;overflow:auto}
.msg{padding:12px;border-radius:16px;margin:10px;white-space:pre-wrap;line-height:1.9}
.user{background:#6d5dfc;margin-right:40px}
.ai{background:#121936;margin-left:40px}
.src{margin:-4px 50px 10px;font-size:13px;line-height:2;color:#9aa1c7}
.src a{color:#8fa2ff;margin-left:12px;text-decoration:none;display:inline-block}
.src a:hover{text-decoration:underline}
.media{display:block;max-width:100%;border-radius:14px;margin-top:10px}
.dl{display:inline-block;margin-top:8px;color:#8fa2ff;font-size:13px}
.bottom{padding:18px;border-top:1px solid #252b4b;display:flex;gap:10px}
input{flex:1;background:#111832;color:white;border:1px solid #39406b;border-radius:20px;padding:15px}
.send{background:#6d5dfc;color:white;border:0;border-radius:15px;padding:15px 25px;cursor:pointer}
.send:disabled{opacity:.6;cursor:not-allowed}
.think{display:none;text-align:center;color:#aeb5d8;padding:10px}
.spinner{width:22px;height:22px;border:3px solid #777;border-top-color:#6d5dfc;border-radius:50%;display:inline-block;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
<div class="header">
<div><div class="logo">کاوش ✨</div><div class="sub">دستیار هوشمند عمومی</div></div>
<div class="tools">
<select id="kind" title="نوع خروجی">
<option value="chat">💬 گفتگو</option>
<option value="image">🖼️ ساخت تصویر</option>
<option value="video">🎬 ساخت ویدیو</option>
</select>
<select id="search" title="جستجوی وب">
<option value="auto">🌐 جستجوی وب: خودکار</option>
<option value="on">🌐 جستجوی وب: همیشه</option>
<option value="off">🌐 جستجوی وب: خاموش</option>
</select>
<select id="mode">
<option value="lite">⚡ Lite (سریع)</option>
<option value="mios">🧠 MIOS</option>
<option value="astara" selected>✨ Astara (کامل)</option>
</select>
</div>
</div>

<div class="main" id="welcome">
<div class="brain">🧠</div>
<h1>سلام! من کاوشم.</h1>
<p>برای درس، ریاضی، برنامه‌نویسی، زبان، ایده‌پردازی و تحقیق در کنارت هستم. اخبار و اطلاعات به‌روز را هم از وب پیدا می‌کنم.</p>
<div class="chips">
<button>یک مسئله ریاضی حل کن</button>
<button>این متن را خلاصه کن</button>
<button>پایتون یادم بده</button>
<button>آخرین اخبار فناوری چیست؟</button>
</div>
</div>

<div class="chat" id="chat"></div>
<div class="think" id="think"><span class="spinner"></span><br>کاوش در حال فکر کردن...</div>

<div class="bottom">
<input id="msg" placeholder="پیامت را بنویس...">
<button class="send" id="sendBtn">ارسال</button>
</div>
</div>

<script>
// وقتی صفحه از خود سرور باز شود، خودکار به همان سرور وصل می‌شود.
// اگر فایل را مستقیم (file://) باز کنید، به آدرس زیر وصل می‌شود.
const REMOTE_URL = "https://havosh.onrender.com/api/ai-chat";
const API_URL = location.protocol.startsWith("http") ? "/api/ai-chat" : REMOTE_URL;

const chat = document.getElementById('chat');
const welcome = document.getElementById('welcome');
const think = document.getElementById('think');
const msg = document.getElementById('msg');
const mode = document.getElementById('mode');
const searchSel = document.getElementById('search');
const sendBtn = document.getElementById('sendBtn');
const kind = document.getElementById('kind');
const history = [];
const API_BASE = API_URL.replace('/api/ai-chat','');
const sleep = ms => new Promise(r => setTimeout(r, ms));

function add(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function addSources(list){
  if(!Array.isArray(list) || !list.length) return;
  const box = document.createElement('div');
  box.className = 'src';
  box.append('منابع: ');
  list.forEach((s, i) => {
    if(!/^https?:\/\//.test(s.url)) return;
    const a = document.createElement('a');
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = '[' + (i + 1) + '] ' + (s.title || s.url).slice(0, 60);
    box.appendChild(a);
  });
  chat.appendChild(box);
  chat.scrollTop = chat.scrollHeight;
}

async function postJson(path, body){
  const res = await fetch(API_BASE + path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok && !data.error) data.error = "خطا (" + res.status + ")";
  return data;
}
function addMedia(tag, src){
  const d = document.createElement('div');
  d.className = 'msg ai';
  const el = document.createElement(tag);
  el.className = 'media';
  el.src = src;
  if(tag === 'video'){ el.controls = true; el.autoplay = false; }
  d.appendChild(el);
  if(/^https?:|^data:image\//.test(src)){
    const a = document.createElement('a');
    a.className = 'dl'; a.href = src; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.download = tag === 'img' ? 'kavosh.png' : 'kavosh.mp4';
    a.textContent = 'دانلود / باز کردن';
    d.appendChild(a);
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
async function makeImage(prompt){
  const data = await postJson('/api/image', {prompt});
  if(!data.ok || !data.image){ add(data.error || "ساخت تصویر ناموفق بود", "ai"); return; }
  addMedia('img', data.image);
}
async function makeVideo(prompt){
  const data = await postJson('/api/video', {prompt});
  if(!data.ok || !data.id){ add(data.error || "ساخت ویدیو ناموفق بود", "ai"); return; }
  add("ویدیو در حال ساخت است؛ معمولاً یکی دو دقیقه طول می‌کشد...", "ai");
  for(let i = 0; i < 90; i++){
    await sleep(4000);
    let st = {};
    try{
      const r = await fetch(API_BASE + '/api/video-status?id=' + encodeURIComponent(data.id));
      st = await r.json();
    }catch(e){ continue; }
    if(st.status === 'done' && st.video){ addMedia('video', st.video); return; }
    if(st.status === 'failed' || (st.ok === false && st.error)){ add(st.error || "ساخت ویدیو ناموفق بود", "ai"); return; }
  }
  add("ساخت ویدیو بیش از حد طول کشید. بعداً دوباره تلاش کن.", "ai");
}

async function send(){
  const v = msg.value.trim();
  if(!v) return;
  welcome.style.display = "none";
  chat.style.display = "block";
  msg.value = "";
  add(v, "user");
  history.push({role:"user", content:v});
  think.style.display = "block";
  sendBtn.disabled = true;
  if(kind.value !== 'chat'){
    try{
      if(kind.value === 'image') await makeImage(v); else await makeVideo(v);
    }catch(err){
      add("اتصال به سرور برقرار نشد. دوباره تلاش کن.", "ai");
    }finally{
      think.style.display = "none";
      sendBtn.disabled = false;
      msg.focus();
    }
    return;
  }
  try{
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ messages: history.slice(-20), edition: mode.value, search: searchSel.value })
    });
    let data = {}, raw = "";
    try{ raw = await res.text(); data = JSON.parse(raw); }catch(e){}
    let out = data.answer;
    if(!out){
      out = data.error || (res.ok ? "پاسخی دریافت نشد" : "خطا (" + res.status + "): " + (raw || "").slice(0,200));
    }else{
      history.push({role:"assistant", content:out});
    }
    add(out, "ai");
    addSources(data.sources);
  }catch(err){
    add("اتصال به سرور برقرار نشد. اگر سرور Render تازه بیدار شده، چند ثانیه صبر کن و دوباره بفرست.", "ai");
  }finally{
    think.style.display = "none";
    sendBtn.disabled = false;
    msg.focus();
  }
}

sendBtn.addEventListener('click', send);
msg.addEventListener('keydown', e => { if(e.key === 'Enter') send(); });
document.querySelectorAll('.chips button').forEach(b => {
  b.addEventListener('click', () => { msg.value = b.textContent; send(); });
});
</script>
</body>
</html>
