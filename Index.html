<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کاوش | دستیار هوشمند</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#0b1020;color:#eef2ff}button,textarea,select{font:inherit}.app{max-width:1100px;margin:auto;min-height:100vh;display:flex;flex-direction:column}.top{padding:18px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #202945}.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#6d5dfc;font-size:24px}.title{font-size:21px;font-weight:800}.sub{font-size:12px;color:#9aa5c1}.spacer{flex:1}.select{background:#151c32;color:#fff;border:1px solid #303b5e;border-radius:10px;padding:9px}.chat{flex:1;padding:24px 18px 120px;display:flex;flex-direction:column;gap:14px}.welcome{margin:auto;max-width:650px;text-align:center}.welcome h1{font-size:34px;margin:10px}.welcome p{color:#aab4cd;line-height:2}.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}.chip{border:1px solid #303b5e;background:#121a2e;color:#dce3f7;padding:9px 13px;border-radius:999px;cursor:pointer}.msg{max-width:82%;padding:14px 16px;border-radius:17px;line-height:1.9;white-space:pre-wrap}.user{align-self:flex-start;background:#6d5dfc}.bot{align-self:flex-end;background:#151d33;border:1px solid #293553}.composer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#0b1020 28%);padding:28px 16px 18px}.box{max-width:900px;margin:auto;display:flex;gap:10px;background:#12192b;border:1px solid #303b5e;border-radius:18px;padding:10px}.box textarea{flex:1;background:transparent;color:white;border:0;outline:0;resize:none;min-height:48px;max-height:180px}.send{background:#6d5dfc;color:white;border:0;border-radius:12px;padding:0 20px;cursor:pointer;font-weight:800}.status{text-align:center;font-size:12px;color:#8793b0;margin-top:8px}.danger{color:#ffb4b4}
</style></head><body><div class="app"><header class="top"><div class="logo">✦</div><div><div class="title">کاوش</div><div class="sub">دستیار هوشمند عمومی</div></div><div class="spacer"></div><select id="edition" class="select"><option value="astara">آستارا · چندمدلی</option><option value="lite">لایت · سریع</option><option value="mios">MIOS · Gemini</option></select></header><main id="chat" class="chat"><section id="welcome" class="welcome"><div style="font-size:48px">🧠</div><h1>سلام! من کاوشم.</h1><p>برای درس، ریاضی، برنامه‌نویسی، زبان، ایده‌پردازی، تحقیق، نوشتن و کارهای روزمره در کنارت هستم.</p><div class="chips"><button class="chip">یک مسئله ریاضی حل کن</button><button class="chip">پایتون یادم بده</button><button class="chip">این متن را خلاصه کن</button><button class="chip">یک ایده خلاقانه بده</button></div></section></main><div class="composer"><form id="form" class="box"><textarea id="input" placeholder="پیامت را بنویس..." rows="1"></textarea><button class="send">ارسال</button></form><div id="status" class="status">اتصال به هسته کاوش</div></div></div><script>
const chat=document.querySelector('#chat'),input=document.querySelector('#input'),form=document.querySelector('#form'),status=document.querySelector('#status'),edition=document.querySelector('#edition');let messages=[];edition.value=localStorage.kavoshEdition||'astara';edition.onchange=()=>{localStorage.kavoshEdition=edition.value};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{input.value=b.textContent;input.focus()});function add(text,who){document.querySelector('#welcome')?.remove();const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;input.value='';add(text,'user');messages.push({role:'user',content:text});status.textContent='در حال فکر کردن...';try{const r=await fetch('/api/ai-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({edition:edition.value,messages})});const j=await r.json();const ans=j.answer||j.error||'پاسخی دریافت نشد.';add(ans,'bot');messages.push({role:'assistant',content:ans});status.textContent='آماده';}catch(err){add('ارتباط با سرور برقرار نشد. آدرس سرور را بررسی کن.','bot');status.textContent='خطا در اتصال'}};
</script></body></html>
